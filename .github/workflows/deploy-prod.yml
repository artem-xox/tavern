name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Tavern
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: npm ci --prefix frontend
      - run: npm run check --prefix frontend
      - run: npm run build --prefix frontend
      - name: Deploy App Platform spec
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: .do/app.prod.yaml
          project_id: 83ffb589-ca2f-4f99-8921-0b0e86fa08fd
          print_build_logs: true
      - name: Health check
        env:
          APP: ${{ steps.deploy.outputs.app }}
        run: |
          url=$(jq -er '.live_url // .default_ingress' <<<"$APP")
          for attempt in $(seq 1 12); do
            if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' "$url/health")" = 200 ]; then
              echo "Tavern is healthy at $url"
              exit 0
            fi
            sleep 5
          done
          echo "Tavern did not become healthy: $url"
          exit 1
