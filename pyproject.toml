[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "story-tavern"
version = "0.1.0"
description = "The Story Tavern: famous guests, model-driven, in one evening"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "anthropic>=1.11,<2",
  "langsmith>=0.8,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "mypy>=1.10,<2"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.mypy]
files = ["backend/tavern"]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
